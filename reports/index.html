<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Put Scan Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes hero-flash {
      0%, 100% { background-color: rgba(234, 179, 8, 0.1); }
      50% { background-color: rgba(234, 179, 8, 0.35); }
    }
    .hero-flash { animation: hero-flash 0.7s ease 3; }
    #ticker-cards.new-only .ticker-card:not([data-has-new="true"]) { display: none; }
    #ticker-cards.new-only tbody tr:not([data-new="true"]) { display: none; }
  </style>
</head>
<body class="min-h-screen p-8">

  <div class="max-w-7xl mx-auto">

    <div class="mb-8 flex items-start justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Put Scan Reports</h1>
        <p id="report-ts" class="text-base-content/50 text-sm mt-1">Loading...</p>
      </div>
      <select id="report-select" class="select select-bordered select-sm w-80 shrink-0">
        <option>Loading...</option>
      </select>
    </div>

    <div id="stats" class="stats stats-horizontal shadow bg-base-200 border border-base-300 mb-8 w-full"></div>

    <div id="diff-bar"></div>

    <div id="heroes" class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-8"></div>

    <div class="flex justify-end gap-2 mb-4">
      <button id="new-only-btn" class="btn btn-sm btn-ghost btn-outline hidden" onclick="toggleNewOnly()">New Only</button>
      <button class="btn btn-sm btn-ghost btn-outline" onclick="expandAll()">Expand All</button>
      <button class="btn btn-sm btn-ghost btn-outline" onclick="collapseAll()">Collapse All</button>
    </div>

    <div id="ticker-cards"></div>

  </div>

  <dialog id="tickers-modal" class="modal">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-4">Tickers Flagged</h3>
      <table class="table table-sm w-full">
        <thead><tr><th>Ticker</th><th>YTD Gain</th><th>Puts Found</th></tr></thead>
        <tbody id="ticker-modal-body"></tbody>
      </table>
      <div class="modal-action">
        <form method="dialog"><button class="btn btn-sm">Close</button></form>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <div id="__tip" style="display:none;position:fixed;z-index:9999;max-width:260px;padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.6;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.6);background:#1d232a;color:#a6adbb;border:1px solid rgba(255,255,255,0.1)"></div>

  <script>
  // ── State ─────────────────────────────────────────────────────────────────
  let currentManifest = [];
  let newOnlyActive   = false;

  // ── Color helpers ─────────────────────────────────────────────────────────
  const numCls  = v  => v >= 0 ? 'text-success' : 'text-error';
  const beCls   = p  => p < 25 ? 'text-success' : p < 50 ? 'text-warning' : 'text-error';
  const ivCls   = iv => iv < 1.0 ? 'text-success' : iv < 1.5 ? 'text-warning' : 'text-error';
  const probCls = p  => p < 0.10 ? 'text-base-content/50' : p < 0.25 ? 'text-warning' : 'text-success';

  // ── Tooltip ───────────────────────────────────────────────────────────────
  const tipEl = document.getElementById('__tip');
  function showTip(el) {
    tipEl.textContent = el.dataset.tipText;
    tipEl.style.display = 'block';
    const r = el.getBoundingClientRect();
    tipEl.style.top  = (r.bottom + 8) + 'px';
    tipEl.style.left = '0px';
    const tw = tipEl.getBoundingClientRect().width;
    tipEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - tw - 8)) + 'px';
  }
  function hideTip() { tipEl.style.display = 'none'; }

  // ── Sort ──────────────────────────────────────────────────────────────────
  function sortTable(th) {
    const table  = th.closest('table');
    const colIdx = Array.from(th.parentElement.children).indexOf(th);
    const arrow  = th.querySelector('.sort-arrow');
    const asc    = arrow && arrow.textContent.includes('↓');
    table.querySelectorAll('thead th .sort-arrow').forEach(a => a.textContent = '');
    if (arrow) arrow.textContent = asc ? ' ↑' : ' ↓';
    const tbody = table.querySelector('tbody');
    const rows  = Array.from(tbody.querySelectorAll('tr'));
    rows.sort((a, b) => {
      const at = a.children[colIdx].dataset.sort ?? a.children[colIdx].textContent.trim();
      const bt = b.children[colIdx].dataset.sort ?? b.children[colIdx].textContent.trim();
      const an = parseFloat(at.replace(/[^0-9.-]/g, ''));
      const bn = parseFloat(bt.replace(/[^0-9.-]/g, ''));
      if (!isNaN(an) && !isNaN(bn)) return asc ? an - bn : bn - an;
      return asc ? at.localeCompare(bt) : bt.localeCompare(at);
    });
    rows.forEach(r => tbody.appendChild(r));
  }

  // ── Expand / collapse ─────────────────────────────────────────────────────
  function expandAll() {
    document.querySelectorAll('.collapse input[type="checkbox"]').forEach(cb => cb.checked = true);
  }
  function collapseAll() {
    document.querySelectorAll('.collapse input[type="checkbox"]').forEach(cb => cb.checked = false);
  }
  function expandSection(btn) {
    btn.closest('.ticker-card').querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
  }
  function collapseSection(btn) {
    btn.closest('.ticker-card').querySelector('.collapse-content')
       .querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
  }

  // ── New-only toggle ───────────────────────────────────────────────────────
  function toggleNewOnly() {
    newOnlyActive = !newOnlyActive;
    const cards = document.getElementById('ticker-cards');
    const btn   = document.getElementById('new-only-btn');
    cards.classList.toggle('new-only', newOnlyActive);
    btn.classList.toggle('btn-active', newOnlyActive);
    if (newOnlyActive) expandAll();
  }

  // ── Hero scroll ───────────────────────────────────────────────────────────
  function scrollToHero(id) {
    const row = document.getElementById(id);
    if (!row) return;
    let el = row.parentElement;
    while (el) {
      if (el.classList.contains('collapse')) {
        const cb = el.querySelector(':scope > input[type="checkbox"]');
        if (cb && !cb.checked) cb.checked = true;
      }
      el = el.parentElement;
    }
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    row.classList.remove('hero-flash');
    void row.offsetWidth;
    row.classList.add('hero-flash');
  }

  // ── Table ─────────────────────────────────────────────────────────────────
  const INFO_ICON = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
    class="inline-block w-3.5 h-3.5 ml-1 mb-0.5 opacity-30 hover:opacity-70 transition-opacity cursor-help"
    stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
  </svg>`;

  function makeTh(label, tipText) {
    const esc = tipText.replace(/"/g, '&quot;');
    return `<th class="text-base-content/50 cursor-pointer hover:text-primary select-none" onclick="sortTable(this)">
      <span class="col-label">${label}</span><span class="sort-arrow"></span>
      <span class="inline-flex cursor-help" onclick="event.stopPropagation()"
            data-tip-text="${esc}" onmouseenter="showTip(this)" onmouseleave="hideTip()">${INFO_ICON}</span>
    </th>`;
  }

  const TABLE_HEADER = `<thead><tr class="text-base-content/50">
    ${makeTh('Return',        'Strike price divided by ask price. If the stock hits the strike at expiry, you receive this many times your investment back.')}
    ${makeTh('Prob ITM',      'Black-Scholes risk-neutral probability this put expires in-the-money. Options are ranked by Return x Prob ITM combined — balancing payoff size against likelihood.')}
    ${makeTh('Expiry',        'Option expiration date. The put must expire in-the-money to have intrinsic value.')}
    ${makeTh('Strike',        'The price the stock must fall below for this put to have intrinsic value at expiry.')}
    ${makeTh('Ask',           'Current asking price per share. One contract = 100 shares, so multiply by 100 for total cost per contract.')}
    ${makeTh('Contract Cost', 'Total cost of one contract in USD (ask x 100 shares). This is the actual cash outlay.')}
    ${makeTh('Cost %',        "Ask as a percentage of the current stock price. How much you are risking relative to the stock's value.")}
    ${makeTh('BE Drop',       "Breakeven drop — how far the stock must fall from today's price for you to break even at expiry (strike minus ask, expressed as % below current price).")}
    ${makeTh('IV',            "Implied Volatility — the market's annualised expected price swing baked into the option price. Higher IV means more expensive options.")}
    ${makeTh('Open Int',      'Open Interest — total number of outstanding contracts. Higher open interest means a more liquid market, making it easier to enter and exit.')}
    ${makeTh('Volume',        'Contracts traded today. A real-time liquidity signal — high volume means active market interest right now.')}
  </tr></thead>`;

  function renderTable(puts, currentPrice, heroContract, heroRowId, prevContracts) {
    const rows = puts.map(p => {
      const costPct      = p.ask / currentPrice * 100;
      const contractCost = p.ask * 100;
      const isHero       = p.contract === heroContract;
      const isNew        = prevContracts.size > 0 && !prevContracts.has(p.contract);
      const newBadge     = isNew ? '<span class="badge badge-success badge-xs ml-1 font-bold align-middle">NEW</span>' : '';
      const heroCls      = isHero ? 'bg-yellow-400/10 outline outline-1 outline-yellow-400/40' : '';
      const newCls       = isNew  ? 'border-l-2 border-success/60' : '';
      const rowId        = isHero ? `id="${heroRowId}"` : '';
      const crown        = isHero ? ' 👑' : '';
      const volStr       = p.volume != null ? p.volume.toLocaleString() : '—';
      const volSort      = p.volume ?? 0;
      const expSort      = p.expiry.replace(/-/g, '');
      return `<tr ${rowId} class="${heroCls} ${newCls}" ${isNew ? 'data-new="true"' : ''}>
        <td class="font-bold text-lg ${numCls(p.return_multiple)}">${Math.round(p.return_multiple)}x${crown}${newBadge}</td>
        <td class="${probCls(p.prob_itm)}">${(p.prob_itm * 100).toFixed(1)}%</td>
        <td class="font-mono text-sm" data-sort="${expSort}">${p.expiry}</td>
        <td class="${numCls(p.strike)}">$${Math.round(p.strike)}</td>
        <td class="font-semibold ${numCls(p.ask)}">$${p.ask.toFixed(2)}</td>
        <td class="font-semibold">$${contractCost.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
        <td class="text-info">${costPct.toFixed(2)}%</td>
        <td class="${beCls(p.breakeven_drop_pct)}">${p.breakeven_drop_pct.toFixed(1)}%</td>
        <td class="${ivCls(p.iv)}">${(p.iv * 100).toFixed(0)}%</td>
        <td>${p.open_interest.toLocaleString()}</td>
        <td data-sort="${volSort}">${volStr}</td>
      </tr>`;
    }).join('');
    return `<div class="overflow-x-auto">
      <table class="table table-zebra table-sm w-full">
        ${TABLE_HEADER}
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  function termSection(label, labelCls, count, tableHtml, borderTop) {
    const border = borderTop ? 'border-t border-base-300' : '';
    return `<div class="collapse collapse-arrow ${border}">
      <input type="checkbox" checked />
      <div class="collapse-title min-h-0 py-2 px-4 text-xs font-semibold ${labelCls} uppercase tracking-wider flex items-center gap-2">
        ${label} <span class="font-normal normal-case opacity-60">(${count})</span>
      </div>
      <div class="collapse-content px-0 pb-0">${tableHtml}</div>
    </div>`;
  }

  function renderTickerCard(ticker, shortHero, longHero, moonshotHero, prevContracts, prevTickers) {
    const short     = ticker.puts.filter(p => p.term === 'short');
    const long_     = ticker.puts.filter(p => p.term === 'long');
    const moonshots = ticker.puts.filter(p => p.term === 'moonshot');
    const total     = ticker.puts.length;
    const gainSign  = ticker.gain_pct >= 0 ? '+' : '';
    const gainCls   = ticker.gain_pct >= 0 ? 'text-success' : 'text-error';

    const isNewTicker = prevTickers.size > 0 && !prevTickers.has(ticker.ticker);
    const newPutCount = prevContracts.size > 0
      ? ticker.puts.filter(p => !prevContracts.has(p.contract)).length
      : 0;
    const hasNew = isNewTicker || newPutCount > 0;

    const tickerNewBadge = isNewTicker
      ? '<span class="badge badge-success badge-sm font-bold">NEW TICKER</span>'
      : newPutCount > 0
        ? `<span class="badge badge-success badge-outline badge-sm font-semibold">${newPutCount} new</span>`
        : '';

    let sections = '';
    if (short.length)     sections += termSection('⚡ Short-Dated &lt; 6 months',     'text-base-content/50', short.length,     renderTable(short,     ticker.current_price, shortHero,     'hero-short',     prevContracts), false);
    if (long_.length)     sections += termSection('🚀 Long-Dated / LEAPs 6+ months', 'text-base-content/50', long_.length,     renderTable(long_,     ticker.current_price, longHero,      'hero-long',      prevContracts), !!short.length);
    if (moonshots.length) sections += termSection('🎰 Moonshots — return only',       'text-warning/70',      moonshots.length, renderTable(moonshots, ticker.current_price, moonshotHero, 'hero-moonshot',  prevContracts), !!(short.length || long_.length));

    return `<div class="collapse collapse-arrow bg-base-200 border border-base-300 rounded-xl mb-4 ticker-card" data-has-new="${hasNew}">
      <input type="checkbox" checked />
      <div class="collapse-title flex items-center gap-3">
        <span class="text-xl font-bold">${ticker.ticker}</span>
        <span class="badge badge-lg ${gainCls} badge-outline font-semibold">${gainSign}${Math.round(ticker.gain_pct)}% YTD</span>
        ${tickerNewBadge}
        <span class="text-base-content/50 text-sm">Current: $${ticker.current_price.toFixed(2)}</span>
        <div class="ml-auto flex items-center gap-3">
          <div class="relative z-10 flex gap-1" onclick="event.stopPropagation()">
            <button class="btn btn-xs btn-ghost opacity-40 hover:opacity-90" onclick="expandSection(this)">expand</button>
            <button class="btn btn-xs btn-ghost opacity-40 hover:opacity-90" onclick="collapseSection(this)">collapse</button>
          </div>
          <span class="text-base-content/40 text-xs">${total} put${total !== 1 ? 's' : ''}</span>
        </div>
      </div>
      <div class="collapse-content px-0 pb-0">${sections}</div>
    </div>`;
  }

  function renderHeroCard(put, label, heroRowId, icon) {
    if (!put) return '';
    const contractCost = put.ask * 100;
    return `<div class="card bg-gradient-to-br from-yellow-900/40 to-base-200 border-2 border-yellow-400/60 shadow-lg shadow-yellow-400/10 cursor-pointer hover:border-yellow-300/80 transition-colors"
         onclick="scrollToHero('${heroRowId}')">
      <div class="card-body">
        <div class="flex items-center gap-3 mb-2">
          <span class="text-2xl">${icon}</span>
          <h2 class="card-title text-yellow-300/70 text-sm font-semibold uppercase tracking-widest">${label} — click to jump to row</h2>
        </div>
        <div class="flex items-baseline gap-4 mb-4">
          <span class="text-yellow-300 text-5xl font-black tracking-tight">${put.ticker}</span>
          <span class="badge badge-warning badge-outline text-sm font-semibold">+${Math.round(put.gain_pct)}% YTD</span>
          <span class="text-base-content/40 text-sm">@ $${put.current_price.toFixed(2)}</span>
        </div>
        <div class="flex flex-wrap gap-6">
          <div>
            <div class="text-yellow-300 text-4xl font-black">${Math.round(put.return_multiple)}x</div>
            <div class="text-base-content/50 text-xs uppercase tracking-wide mt-1">Return Multiple</div>
          </div>
          <div>
            <div class="${probCls(put.prob_itm)} text-4xl font-black">${(put.prob_itm * 100).toFixed(1)}%</div>
            <div class="text-base-content/50 text-xs uppercase tracking-wide mt-1">Prob ITM</div>
          </div>
          <div class="divider divider-horizontal"></div>
          <div>
            <div class="text-success text-2xl font-bold">$${put.ask.toFixed(2)}</div>
            <div class="text-base-content/50 text-xs uppercase tracking-wide mt-1">Ask / Share</div>
          </div>
          <div>
            <div class="text-success text-2xl font-bold">$${contractCost.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
            <div class="text-base-content/50 text-xs uppercase tracking-wide mt-1">Contract Cost</div>
          </div>
          <div>
            <div class="text-base-content text-2xl font-bold">$${Math.round(put.strike)}</div>
            <div class="text-base-content/50 text-xs uppercase tracking-wide mt-1">Strike</div>
          </div>
          <div>
            <div class="text-base-content text-2xl font-bold">${put.expiry}</div>
            <div class="text-base-content/50 text-xs uppercase tracking-wide mt-1">Expiry</div>
          </div>
          <div>
            <div class="${ivCls(put.iv)} text-2xl font-bold">${(put.iv * 100).toFixed(0)}%</div>
            <div class="text-base-content/50 text-xs uppercase tracking-wide mt-1">IV</div>
          </div>
        </div>
        <div class="mt-3 font-mono text-xs text-base-content/30">${put.contract}</div>
      </div>
    </div>`;
  }

  // ── Report rendering ──────────────────────────────────────────────────────

  function renderReport(data, prevContracts, prevTickers, prevReportId) {
    document.title = `Put Scan — ${data.generated_at}`;
    document.getElementById('report-ts').textContent = 'Generated ' + data.generated_at.replace('_', ' at ');

    const { summary, heroes, tickers } = data;

    // Reset new-only state on each report load
    newOnlyActive = false;
    document.getElementById('ticker-cards').classList.remove('new-only');
    document.getElementById('new-only-btn').classList.remove('btn-active');

    // Stats
    document.getElementById('stats').innerHTML = `
      <div class="stat">
        <div class="stat-figure text-primary">
          <button class="btn btn-ghost btn-circle" onclick="document.getElementById('tickers-modal').showModal()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-8 h-8 stroke-current text-primary">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </button>
        </div>
        <div class="stat-title">Tickers Flagged</div>
        <div class="stat-value text-primary">${summary.tickers_flagged}</div>
        <div class="stat-desc">500%+ YTD gainers</div>
      </div>
      <div class="stat">
        <div class="stat-figure text-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-8 h-8 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
          </svg>
        </div>
        <div class="stat-title">Short-Dated Puts</div>
        <div class="stat-value text-secondary">${summary.short_puts}</div>
        <div class="stat-desc">Under 6 months to expiry</div>
      </div>
      <div class="stat">
        <div class="stat-figure text-accent">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-8 h-8 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
        </div>
        <div class="stat-title">Long-Dated / LEAPs</div>
        <div class="stat-value text-accent">${summary.long_puts}</div>
        <div class="stat-desc">6+ months to expiry</div>
      </div>`;

    // Diff bar
    const diffBar = document.getElementById('diff-bar');
    const newBtn  = document.getElementById('new-only-btn');
    if (prevContracts.size > 0) {
      const newPuts    = tickers.flatMap(t => t.puts).filter(p => !prevContracts.has(p.contract)).length;
      const newTickers = tickers.filter(t => !prevTickers.has(t.ticker)).length;
      const prevLabel  = prevReportId.replace('put-scan-', '').replace('_', ' at ');
      const parts = [];
      if (newTickers > 0) parts.push(`<span class="font-semibold text-success">${newTickers} new ticker${newTickers !== 1 ? 's' : ''}</span>`);
      if (newPuts > 0)    parts.push(`<span class="font-semibold text-success">${newPuts} new put${newPuts !== 1 ? 's' : ''}</span>`);
      const summary_str = parts.length > 0
        ? parts.join(', ')
        : '<span class="text-base-content/50">no new items</span>';
      diffBar.innerHTML = `<div class="alert bg-base-200 border border-base-300 mb-6 text-sm flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="w-4 h-4 shrink-0 stroke-current opacity-50"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>vs <span class="font-mono text-base-content/60">${prevLabel}</span> — ${summary_str}</span>
      </div>`;
      newBtn.classList.toggle('hidden', newPuts === 0 && newTickers === 0);
    } else {
      diffBar.innerHTML = '';
      newBtn.classList.add('hidden');
    }

    // Heroes
    const shortHero    = heroes.short?.contract    ?? '';
    const longHero     = heroes.long?.contract     ?? '';
    const moonshotHero = heroes.moonshot?.contract ?? '';

    document.getElementById('heroes').innerHTML = [
      renderHeroCard(heroes.short,    'Best Short-Dated',           'hero-short',    '⚡'),
      renderHeroCard(heroes.long,     'Best Long-Dated / LEAP',     'hero-long',     '🚀'),
      renderHeroCard(heroes.moonshot, 'Top Moonshot — return only', 'hero-moonshot', '🎰'),
    ].join('');

    document.getElementById('ticker-cards').innerHTML = tickers
      .map(t => renderTickerCard(t, shortHero, longHero, moonshotHero, prevContracts, prevTickers))
      .join('');

    document.getElementById('ticker-modal-body').innerHTML = tickers.map(t => {
      const shortCount = t.puts.filter(p => p.term === 'short').length;
      const longCount  = t.puts.filter(p => p.term === 'long').length;
      const sign       = t.gain_pct >= 0 ? '+' : '';
      return `<tr>
        <td class="font-bold">${t.ticker}</td>
        <td class="text-success">${sign}${Math.round(t.gain_pct)}%</td>
        <td class="text-base-content/60">${shortCount}s / ${longCount}l</td>
      </tr>`;
    }).join('');
  }

  // ── Data loading ──────────────────────────────────────────────────────────
  // To migrate to AWS: replace these fetch() URLs with your S3/API endpoints.

  async function loadReport(id) {
    location.hash = id;
    const [res, prevContracts, prevTickers, prevId] = await (async () => {
      const r = fetch(`${id}.json`);
      const idx = currentManifest.findIndex(m => m.id === id);
      const prevEntry = currentManifest[idx + 1];
      if (!prevEntry) return [await r, new Set(), new Set(), null];
      try {
        const prevData = await fetch(`${prevEntry.id}.json`).then(r => r.json());
        const contracts = new Set(prevData.tickers.flatMap(t => t.puts.map(p => p.contract)));
        const tickers   = new Set(prevData.tickers.map(t => t.ticker));
        return [await r, contracts, tickers, prevEntry.id];
      } catch {
        return [await r, new Set(), new Set(), null];
      }
    })();
    const data = await res.json();
    renderReport(data, prevContracts, prevTickers, prevId);
  }

  async function init() {
    let manifest;
    try {
      manifest = await fetch('manifest.json').then(r => r.json());
    } catch {
      document.getElementById('report-ts').textContent = 'No reports found — run the scanner to generate one.';
      return;
    }
    currentManifest = manifest;

    const select = document.getElementById('report-select');
    select.innerHTML = manifest.map(r => {
      const label = `${r.generated_at.replace('_', ' at ')} — ${r.tickers_flagged} tickers, ${(r.short_puts ?? 0) + (r.long_puts ?? 0)} puts`;
      return `<option value="${r.id}">${label}</option>`;
    }).join('');
    select.addEventListener('change', () => loadReport(select.value));

    const hashId = location.hash.slice(1);
    const target = manifest.find(r => r.id === hashId)?.id ?? manifest[0]?.id;
    if (target) {
      select.value = target;
      await loadReport(target);
    }
  }

  window.addEventListener('hashchange', () => {
    const id = location.hash.slice(1);
    if (id && currentManifest.find(m => m.id === id)) {
      document.getElementById('report-select').value = id;
      loadReport(id);
    }
  });

  init();
  </script>
</body>
