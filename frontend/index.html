<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Options</title>

    <!-- SEO: primary description shown in Google search result snippets -->
    <meta name="description" content="Twice-daily scans for asymmetric options plays — cheap OTM puts on extreme gainers and cheap calls on momentum names from S&P 500, NASDAQ 100, and leading thematic ETFs." />

    <!-- SEO: canonical URL tells Google which URL is authoritative, preventing duplicate-content penalties -->
    <link rel="canonical" href="https://tailwindoptions.com/" />

    <!-- SEO: Open Graph tags control how the link preview appears when shared on social platforms (LinkedIn, Reddit, Slack, iMessage, etc.) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://tailwindoptions.com/" />
    <meta property="og:title"       content="Tailwind Options" />
    <meta property="og:description" content="Twice-daily scans for asymmetric options plays — cheap OTM puts on extreme gainers and cheap calls on momentum names from S&P 500, NASDAQ 100, and leading thematic ETFs." />
    <meta property="og:image" content="https://tailwindoptions.com/og-image.png" />

    <!-- SEO: Twitter/X card tags — summary_large_image shows a wide preview card instead of a small thumbnail -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Tailwind Options" />
    <meta name="twitter:description" content="Twice-daily scans for asymmetric options plays — cheap OTM puts on extreme gainers and cheap calls on momentum names from S&P 500, NASDAQ 100, and leading thematic ETFs." />
    <meta name="twitter:image" content="https://tailwindoptions.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
