name: Deploy

on:
  push:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CDK infra deps
        run: pip install -r infra/requirements.txt

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Bootstrap CDK (idempotent)
        run: cdk bootstrap -c stage=beta

      # ── Beta ────────────────────────────────────────────────────────────────

      - name: Deploy beta
        run: cdk deploy -c stage=beta --require-approval never --ci

      - name: Integration tests (beta)
        timeout-minutes: 15
        run: |
          pip install boto3 httpx pytest
          pytest tests/integration/ -v --override-ini="addopts=" --tb=short

      # ── Prod ────────────────────────────────────────────────────────────────

      - name: Deploy prod
        run: cdk deploy -c stage=prod --require-approval never --ci
