[project]
name = "tailwind-options"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "yfinance>=0.2",
    "lxml>=4.9",
]

[tool.setuptools.packages.find]
include = ["tailwind_options*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tailwind_options --cov=lambda_handler --cov-report=term-missing --cov-fail-under=90 -m 'not integration'"
markers = ["integration: requires a deployed AWS environment (run via pytest tests/integration/ --override-ini='addopts=')"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
