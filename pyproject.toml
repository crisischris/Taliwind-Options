[project]
name = "indicators"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "yfinance>=0.2",
    "exchange-calendars>=4.5",
    "lxml>=4.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
